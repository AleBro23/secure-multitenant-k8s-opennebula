<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ team_name }} — Task Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: {{ team_color }};
      --accent-soft: {{ team_color }}1A;
      --bg: #fafafa;
      --surface: #ffffff;
      --border: #e5e5e5;
      --text: #18181b;
      --text-muted: #71717a;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      margin: 0;
      padding: 3rem 1.5rem;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 560px; margin: 0 auto; }

    header {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      margin-bottom: 2rem;
    }
    .badge {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    header h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 600;
    }
    header p {
      margin: 0.1rem 0 0;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.75rem;
    }

    form.add-form {
      display: flex;
      gap: 0.6rem;
      margin-bottom: 1.5rem;
    }
    input[type=text] {
      flex: 1;
      padding: 0.65rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      font-family: inherit;
      background: var(--bg);
      transition: border-color 0.15s;
    }
    input[type=text]:focus {
      outline: none;
      border-color: var(--accent);
      background: var(--surface);
    }
    button.add-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0 1.1rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: opacity 0.15s;
    }
    button.add-btn:hover { opacity: 0.85; }

    ul.task-list { list-style: none; padding: 0; margin: 0; }
    li.task {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.85rem 0.2rem;
      border-bottom: 1px solid var(--border);
    }
    li.task:last-child { border-bottom: none; }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }
    .task-content {
      flex: 1;
      font-size: 0.9rem;
    }
    .task-date {
      font-size: 0.72rem;
      color: var(--text-muted);
    }
    button.delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 0.3rem;
      border-radius: 6px;
      display: flex;
      transition: background 0.15s, color 0.15s;
    }
    button.delete-btn:hover {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .empty {
      text-align: center;
      padding: 2rem 0 0.5rem;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.72rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="badge">{{ team_name[0] }}</div>
      <div>
        <h1>{{ team_name }}</h1>
        <p>Task Board</p>
      </div>
    </header>

    <div class="card">
      <form class="add-form" action="/add" method="post">
        <input type="text" name="content" placeholder="Add a new task..." required autofocus>
        <button type="submit" class="add-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          Add
        </button>
      </form>

      {% if tasks %}
      <ul class="task-list">
        {% for id, content, created_at in tasks %}
        <li class="task">
          <span class="dot"></span>
          <span class="task-content">{{ content }}</span>
          <form action="/delete/{{ id }}" method="post">
            <button type="submit" class="delete-btn" title="Delete task">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </form>
        </li>
        {% endfor %}
      </ul>
      {% else %}
      <p class="empty">No tasks yet — add your first one above.</p>
      {% endif %}
    </div>

    <footer>Secure Multi-Tenant Kubernetes Platform · isolated namespace demo</footer>
  </div>
</body>
</html>
