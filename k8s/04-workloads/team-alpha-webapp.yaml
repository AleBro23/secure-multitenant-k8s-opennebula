apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: team-alpha
  labels:
    app: webapp
    team: alpha
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
        team: alpha
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webapp
          image: team-webapp:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          envFrom:
            - secretRef:
                name: postgres-credentials
          env:
            - name: TEAM_NAME
              value: "Team Alpha"
            - name: TEAM_COLOR
              value: "#4f46e5"
            - name: POSTGRES_HOST
              value: "postgres"
          ports:
            - containerPort: 5000
          resources:
            limits:
              cpu: "300m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: webapp
  namespace: team-alpha
spec:
  type: NodePort
  selector:
    app: webapp
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30081