apiVersion: v1
kind: ServiceAccount #binded to the namespace team-alpha, this service account will be used by the developers to access the resources in the namespace
metadata:
  name: alpha-dev
  namespace: team-alpha
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alpha-dev-role
  namespace: team-alpha
rules:
  - apiGroups: ["", "apps"] # "" represents the core API group, "apps" represents the apps API group, which includes resources like deployments and replicasets
    resources: ["pods", "services", "deployments", "replicasets", "configmaps", "secrets", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log", "pods/exec"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: #binds the role alpha-dev-role to the service account alpha-dev in the namespace team-alpha, allowing the developers to perform the actions defined in the role
  name: alpha-dev-binding
  namespace: team-alpha
subjects:
  - kind: ServiceAccount
    name: alpha-dev
    namespace: team-alpha
roleRef:
  kind: Role
  name: alpha-dev-role #the role defined above
  apiGroup: rbac.authorization.k8s.io