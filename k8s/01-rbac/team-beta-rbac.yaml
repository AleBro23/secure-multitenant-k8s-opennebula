apiVersion: v1
kind: ServiceAccount
metadata:
  name: beta-dev
  namespace: team-beta
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: beta-dev-role
  namespace: team-beta
rules:
  - apiGroups: ["", "apps"]
    resources: ["pods", "services", "deployments", "replicasets", "configmaps", "secrets", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log", "pods/exec"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: beta-dev-binding
  namespace: team-beta
subjects:
  - kind: ServiceAccount
    name: beta-dev
    namespace: team-beta
roleRef:
  kind: Role
  name: beta-dev-role
  apiGroup: rbac.authorization.k8s.io