apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-beta-quota
  namespace: team-beta
spec:
  hard: # specifies the maximum amount of compute resources that can be consumed by the team-beta namespace
    requests.cpu: "600m" #minimum amounto of CPU
    requests.memory: 1200Mi
    limits.cpu: "1000m" #maximum amount of CPU
    limits.memory: 2000Mi
    pods: "10"